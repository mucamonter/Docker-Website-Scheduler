<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Agendamento</title>
  <link rel="stylesheet" href="login.css"></head>

<body><div class="container">
<div class="top"><div class="left-top"><img src="images.jpg" alt="Logo da Prefeitura"></div><div class="center-top"><h2>Login</h2></div><div class="right-top"></div></div>

<p id="descricao">Entre com seu e-mail e senha para consultar seus agendamentos.</p>
<form id="formLogin">
<label id="labelUsuario" for="login">E-mail:</label><input type="text" id="login" autocomplete="username" required placeholder="Digite seu e-mail ou usuário">
<label for="senha">Senha:</label><input type="password" id="senha" autocomplete="current-password" required placeholder="Digite sua senha">
<button type="submit">Entrar</button><div id="mensagem"></div>
</form>
<div id="linkCadastro"><hr><p>Ainda não possui conta?</p><button type="button" onclick="location.href='/cadastro.html'">Criar conta de cidadão</button></div>
</div>
<script>
const form=document.getElementById('formLogin');
const login=document.getElementById('login');
const senha=document.getElementById('senha');
const mensagem=document.getElementById('mensagem');

form.addEventListener('submit',async e=>{
  e.preventDefault();
  mensagem.textContent='';
  mensagem.className='';

  const loginValor=login.value.trim();
  const senhaValor=senha.value;

  if(!loginValor || !senhaValor){
    mensagem.className='erro';
    mensagem.textContent='Preencha o login/e-mail e a senha.';
    return;
  }

  try{
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({login:loginValor,senha:senhaValor})
    });

    const d=await r.json();
    if(!r.ok) throw new Error(d.mensagem||'Usuário ou senha inválidos.');
    location.href=d.redirect;
  }catch(err){
    mensagem.className='erro';
    mensagem.textContent=err.message;
  }
});
</script></body></html>

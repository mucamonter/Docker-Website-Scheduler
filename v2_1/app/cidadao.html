<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Área do cidadão</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container">
<div class="top"><div class="left-top"><img src="../images.jpg" alt="Logo"></div><div class="center-top"><h2>Área do cidadão</h2></div><div class="right-top"><button id="sair">Sair</button></div></div>
<p id="boasVindas"></p>
<h3>Meus agendamentos</h3><div id="mensagem"></div><div id="lista">Carregando...</div>
<hr><button type="button" onclick="location.href='/agendamento.html'">Novo agendamento</button>
</div>
<script>
async function carregar(){
 const r=await fetch('/api/cidadao/meus-agendamentos'); if(r.status===401){location.href='/login.html';return;} const d=await r.json();
 document.getElementById('boasVindas').textContent='Olá, '+d.cidadao.nome+'.';
 const lista=document.getElementById('lista');
 if(!d.agendamentos.length){lista.innerHTML='<p>Você ainda não possui agendamentos.</p>';return;}
 lista.innerHTML=d.agendamentos.map(a=>`<div class="agendamento-card"><strong>${a.data_br} às ${a.horario}</strong><br>Motivo: ${escapeHtml(a.motivo||'—')}<br>Status: <strong>${escapeHtml(a.status)}</strong><br>${a.status==='agendado'?`<button data-id="${a.id}" class="cancelar">Cancelar</button>`:''}</div>`).join('');
 document.querySelectorAll('.cancelar').forEach(b=>b.onclick=async()=>{if(!confirm('Deseja realmente cancelar este agendamento?'))return;const r=await fetch('/api/cidadao/agendamentos/'+b.dataset.id+'/cancelar',{method:'PATCH'});const x=await r.json();if(!r.ok){alert(x.mensagem||'Erro');return;}carregar();});
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
document.getElementById('sair').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/login.html';}; carregar();
</script></body></html>

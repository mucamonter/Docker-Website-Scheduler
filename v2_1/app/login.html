<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Agendamento</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="container">
<div class="top">
    <div class="left-top">
        <img src="images.jpg" alt="Logo da Prefeitura"></div><div class="center-top"><h2>Login</h2></div><div class="right-top"></div></div>
<div style="display:flex;gap:10px;margin-bottom:15px"></div>
<p id="descricao">Entre com seu e-mail e senha para consultar seus agendamentos.</p>

<form id="formLogin">

    <label for="login">E-mail ou usuário:</label>

    <input
        type="text"
        id="login"
        autocomplete="username"
        placeholder="Digite seu e-mail ou usuário"
        required
    >

    <label for="senha">Senha:</label>

    <input
        type="password"
        id="senha"
        autocomplete="current-password"
        placeholder="Digite sua senha"
        required
    >

    <button type="submit">Entrar</button>

    <div id="mensagem"></div>

</form>


<div id="linkCadastro"><hr><p>Ainda não possui conta?</p><button type="button" onclick="location.href='/cadastro.html'">Criar conta de cidadão</button></div>
</div>
<script>
document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();

    const mensagem = document.getElementById('mensagem');

    const login = document.getElementById('login').value.trim();
    const senha = document.getElementById('senha').value;

    mensagem.textContent = '';
    mensagem.className = '';

    if (!login || !senha) {
        mensagem.textContent = 'Preencha o usuário/e-mail e a senha.';
        mensagem.className = 'erro';
        return;
    }

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                login: login,
                senha: senha
            })
        });

        const resultado = await response.json();

        if (!response.ok) {
            mensagem.textContent =
                resultado.mensagem || 'Usuário ou senha inválidos.';
            mensagem.className = 'erro';
            return;
        }

        // O BACKEND decidiu quem é o usuário.
        window.location.href = resultado.redirect;

    } catch (error) {
        console.error(error);

        mensagem.textContent =
            'Não foi possível conectar ao servidor.';
        mensagem.className = 'erro';
    }
});
</script></body></html>

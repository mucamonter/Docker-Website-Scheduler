<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento com o Prefeito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Agendamento - Gabinete do Prefeito</h2>
    
    <form id="formAgendamento">
        <label>Você já possui cadastro na Prefeitura?</label>
        <div class="radio-group">
            <label><input type="radio" name="temCadastro" value="sim" onclick="alternarCampos(true)"> Sim</label>
            <label><input type="radio" name="temCadastro" value="nao" onclick="alternarCampos(false)" checked> Não</label>
        </div>

        <!-- Campos para quem NÃO tem cadastro -->
        <div id="camposCadastro">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" placeholder="00000-000" required>

            <label for="endereco">Endereço Residencial:</label>
            <input type="text" id="endereco" required>
        </div>

        <!-- Campo para quem JÁ tem cadastro (Apenas digita o nome, sem listar os outros) -->
         <div id="camposJaCadastrado" class="hidden">
            <label for="nomeIdentificacao">Digite seu Nome Completo para buscar seu cadastro:</label>
            <input type="text" id="nomeIdentificacao" placeholder="Comece a digitar seu nome..." list="listaCidadaos" oninput="buscarCidadaos(this.value)" autocomplete="off">
            <datalist id="listaCidadaos"></datalist>
        </div>

        <!-- Campos Comuns de Agendamento -->
        <label for="motivo">Motivo do Agendamento:</label>
        <textarea id="motivo" rows="3" placeholder="Descreva brevemente o assunto..." required></textarea>

        <label for="data">Data Desejada:</label>
        <input type="date" id="data" required onchange="validarData(this)">

        <label for="horario">Horário (9h às 16h):</label>
        <select id="horario" required>
            <option value="">Selecione um horário</option>
            <option value="09:00">09:00</option>
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
            <option value="15:00">15:00</option>
            <option value="16:00">16:00</option>
        </select>

        <button type="submit">Confirmar Agendamento</button>
        <div id="mensagem" class="sucesso"></div>
    </form>
</div>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo</title><link rel="stylesheet" href="style.css">
<style>
.admin-header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.filtros input,.filtros select{flex:1;min-width:160px}.tabela-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}th{background:#f4f4f4}.status{font-weight:bold}.acoes{display:flex;gap:6px;flex-wrap:wrap}.acoes button{margin:0;padding:7px 10px}.btn-feito{background:#198754}.btn-cancelar{background:#dc3545}.btn-voltar{background:#6c757d}.btn-editar{background:#0d6efd}.erro{color:#b00020;margin-top:10px}.vazio{text-align:center;padding:30px}.detalhes{white-space:pre-line}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}.modal-backdrop.aberto{display:flex}.modal{background:#fff;border-radius:10px;max-width:700px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.25)}.modal h3{margin-top:0}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-grid .campo-full{grid-column:1/-1}.modal label{display:block;font-weight:600;margin-bottom:5px}.modal input,.modal textarea,.modal select{width:100%;box-sizing:border-box;padding:9px}.modal textarea{min-height:90px;resize:vertical}.modal-acoes{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.btn-secundario{background:#6c757d}.btn-salvar{background:#198754}.confirmacao{font-size:15px;line-height:1.5}.confirmacao strong{display:block;margin-bottom:8px}.modal-confirmacao .modal{max-width:460px}@media(max-width:650px){.modal-grid{grid-template-columns:1fr}.modal-grid .campo-full{grid-column:auto}}
</style>
</head>
<body>
<div class="container" style="max-width:1400px;">
<div class="admin-header"><div><h2>Painel de Agendamentos</h2><p>Consulte, edite e altere os atendimentos.</p></div><button class="btn-voltar" id="sair">Sair</button></div>
<div class="filtros"><input type="date" id="filtroData"><select id="filtroStatus"><option value="">Todos os status</option><option value="agendado">Agendado</option><option value="feito">Feito</option><option value="cancelado">Cancelado</option></select><input type="text" id="filtroNome" placeholder="Buscar por nome"><button id="buscar">Buscar</button></div>
<div id="mensagem"></div><div class="tabela-wrap"><table><thead><tr><th>Data</th><th>Horário</th><th>Cidadão</th><th>Motivo</th><th>E-mail</th><th>CEP</th><th>Endereço</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabela"></tbody></table></div>
</div>

<div class="modal-backdrop" id="modalEdicao"><div class="modal"><h3>Editar agendamento</h3><form id="formEdicao"><input type="hidden" id="editId"><div class="modal-grid"><div><label for="editNome">Nome</label><input id="editNome" required></div><div><label for="editEmail">E-mail</label><input id="editEmail" type="email"></div><div><label for="editData">Data</label><input id="editData" type="date" required></div><div><label for="editHorario">Horário</label><select id="editHorario" required></select></div><div><label for="editCep">CEP</label><input id="editCep"></div><div><label for="editEndereco">Endereço</label><input id="editEndereco"></div><div class="campo-full"><label for="editMotivo">Motivo</label><textarea id="editMotivo" required></textarea></div></div><div class="modal-acoes"><button type="button" class="btn-secundario" id="fecharEdicao">Voltar</button><button type="submit" class="btn-salvar">Salvar alterações</button></div></form></div></div>
<div class="modal-backdrop modal-confirmacao" id="modalConfirmacao"><div class="modal"><div class="confirmacao" id="textoConfirmacao"></div><div class="modal-acoes"><button type="button" class="btn-secundario" id="naoConfirmar">Não</button><button type="button" class="btn-cancelar" id="simConfirmar">Sim, confirmar</button></div></div></div>

<script>
const tabela=document.getElementById('tabela'),mensagem=document.getElementById('mensagem');
const HORARIOS=['09:00','10:00','11:00','13:00','14:00','15:00','16:00'];
let agendamentosCache=[];let acaoConfirmacao=null;
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function dataBR(v){if(!v)return '';const [a,m,d]=String(v).slice(0,10).split('-');return `${d}/${m}/${a}`;}
function statusLabel(s){return ({agendado:'Agendado',feito:'Feito',cancelado:'Cancelado'})[s]||s;}
function abrirConfirmacao(texto,acao){document.getElementById('textoConfirmacao').innerHTML=texto;acaoConfirmacao=acao;document.getElementById('modalConfirmacao').classList.add('aberto');}
function fecharConfirmacao(){acaoConfirmacao=null;document.getElementById('modalConfirmacao').classList.remove('aberto');}
async function verificarLogin(){const r=await fetch('/api/admin/me');if(!r.ok)location.href='/login.html';}
async function carregar(){mensagem.textContent='';const p=new URLSearchParams();const d=document.getElementById('filtroData').value,s=document.getElementById('filtroStatus').value,n=document.getElementById('filtroNome').value.trim();if(d)p.set('data',d);if(s)p.set('status',s);if(n)p.set('nome',n);try{const r=await fetch('/api/admin/agendamentos?'+p);if(r.status===401){location.href='/login.html';return}const data=await r.json();if(!r.ok)throw new Error(data.mensagem||'Não foi possível carregar.');agendamentosCache=data.agendamentos||[];tabela.innerHTML='';if(!agendamentosCache.length){tabela.innerHTML='<tr><td colspan="9" class="vazio">Nenhum agendamento encontrado.</td></tr>';return}agendamentosCache.forEach(a=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${escapeHtml(dataBR(a.data))}</td><td>${escapeHtml(String(a.horario).slice(0,5))}</td><td><strong>${escapeHtml(a.nome)}</strong></td><td class="detalhes">${escapeHtml(a.motivo)}</td><td>${escapeHtml(a.email||'')}</td><td>${escapeHtml(a.cep||'')}</td><td>${escapeHtml(a.endereco||'')}</td><td class="status">${escapeHtml(statusLabel(a.status))}</td><td class="acoes"><button class="btn-editar" onclick="abrirEdicao(${a.id})">Editar</button><button class="btn-feito" onclick="pedirStatus(${a.id},'feito')">Feito</button><button class="btn-cancelar" onclick="pedirStatus(${a.id},'cancelado')">Cancelar</button>${a.status!=='agendado'?'<button onclick="pedirStatus('+a.id+',\'agendado\')">Reabrir</button>':''}</td>`;tabela.appendChild(tr)})}catch(e){mensagem.textContent=e.message;mensagem.className='erro';}}
function pedirStatus(id,status){const a=agendamentosCache.find(x=>x.id===id);if(!a)return;const verbo=status==='cancelado'?'cancelar':status==='feito'?'marcar como feito':'reabrir';abrirConfirmacao(`<strong>Confirmar ação</strong>Você deseja <b>${verbo}</b> o atendimento de <b>${escapeHtml(a.nome)}</b>, em <b>${dataBR(a.data)} às ${escapeHtml(String(a.horario).slice(0,5))}</b>?`,()=>alterarStatus(id,status));}
async function alterarStatus(id,status){try{const r=await fetch(`/api/admin/agendamentos/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});const d=await r.json();if(!r.ok)throw new Error(d.mensagem||'Não foi possível alterar.');carregar()}catch(e){alert(e.message)}}
function abrirEdicao(id){const a=agendamentosCache.find(x=>x.id===id);if(!a)return;document.getElementById('editId').value=a.id;document.getElementById('editNome').value=a.nome||'';document.getElementById('editEmail').value=a.email||'';document.getElementById('editData').value=String(a.data).slice(0,10);document.getElementById('editCep').value=a.cep||'';document.getElementById('editEndereco').value=a.endereco||'';document.getElementById('editMotivo').value=a.motivo||'';preencherHorariosEdicao(String(a.horario).slice(0,5));document.getElementById('modalEdicao').classList.add('aberto');}
function preencherHorariosEdicao(selecionado){const s=document.getElementById('editHorario');s.innerHTML='';HORARIOS.forEach(h=>{const o=document.createElement('option');o.value=h;o.textContent=h;if(h===selecionado)o.selected=true;s.appendChild(o)});}
function fecharEdicao(){document.getElementById('modalEdicao').classList.remove('aberto');}
async function salvarEdicao(e){e.preventDefault();const id=document.getElementById('editId').value;const dados={nome:document.getElementById('editNome').value.trim(),email:document.getElementById('editEmail').value.trim(),data:document.getElementById('editData').value,horario:document.getElementById('editHorario').value,cep:document.getElementById('editCep').value.trim(),endereco:document.getElementById('editEndereco').value.trim(),motivo:document.getElementById('editMotivo').value.trim()};abrirConfirmacao(`<strong>Confirmar edição</strong>Salvar as alterações deste agendamento para <b>${escapeHtml(dados.nome)}</b>, em <b>${dataBR(dados.data)} às ${escapeHtml(dados.horario)}</b>?`,async()=>{try{const r=await fetch(`/api/admin/agendamentos/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});const d=await r.json();if(!r.ok)throw new Error(d.mensagem||'Não foi possível editar.');fecharEdicao();carregar()}catch(e){alert(e.message)}});}
document.getElementById('buscar').onclick=carregar;document.getElementById('sair').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/login.html'};document.getElementById('fecharEdicao').onclick=fecharEdicao;document.getElementById('formEdicao').onsubmit=salvarEdicao;document.getElementById('naoConfirmar').onclick=fecharConfirmacao;document.getElementById('simConfirmar').onclick=async()=>{const acao=acaoConfirmacao;fecharConfirmacao();if(acao)await acao()};document.getElementById('modalEdicao').addEventListener('click',e=>{if(e.target.id==='modalEdicao')fecharEdicao()});document.getElementById('modalConfirmacao').addEventListener('click',e=>{if(e.target.id==='modalConfirmacao')fecharConfirmacao()});verificarLogin().then(carregar);
</script>
</body></html>

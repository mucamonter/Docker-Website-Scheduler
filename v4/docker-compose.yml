services:
  
  db:
    image: mariadb:lts
    container_name: mariadb-server
    ports: ["3306:3306"]
    restart: unless-stopped
    environment:
      MYSQL_USER: admin
      MYSQL_ROOT_PASSWORD: Ardmin321
      MYSQL_DATABASE: V2_DB
      MYSQL_PASSWORD: Ardmin321
      
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/prisma:/docker-entrypoint-initdb.d:ro
    
    
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 30s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports: ["3000:3000"]
    
        
    restart: unless-stopped
    volumes:
        - .:/app
        - /app/node_modules
        - /app/generated
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 3306
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 3000
      env_file: .env
      command: npm run dev
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy

  
volumes:
  mysql_data:

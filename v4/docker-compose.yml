services:
  
  db:
    image: mariadb:lts
    container_name: mariadb-server
    ports: ["3306:3306"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_USER: admin
      MYSQL_ROOT_PASSWORD: Ardmin321
      MYSQL_DATABASE: V2_DB
      MYSQL_PASSWORD: Ardmin321
      
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/prisma:/docker-entrypoint-initdb.d:ro
    
    
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 0.0.0.0 -u root -pArdmin321 --silent || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports: ["3000:3000"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
        - .:/app
        - /app/node_modules
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 3306
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 3000
      env_file: .env
      command: sh -c "pnpm exec prisma db push --schema=prisma/schema.prisma && pnpm start"
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy

  
volumes:
  mysql_data:

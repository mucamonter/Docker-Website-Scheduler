<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro do cidadão</title><link rel="stylesheet" href="style.css">
</head>
<body><div class="container">
<div class="top"><div class="left-top"><img src="../images.jpg" alt="Logo"></div><div class="center-top"><h2>Cadastro do cidadão</h2></div><div class="right-top"></div></div>
<p>Crie sua conta para acompanhar seus agendamentos.</p>
<form id="formCadastro">
<label for="nome">Nome completo:</label><input id="nome" required maxlength="150">
<label for="email">E-mail:</label><input id="email" type="email" autocomplete="email" required maxlength="255">
<label for="telefone">Telefone:</label><input id="telefone" maxlength="30" autocomplete="tel">
<label for="senha">Senha:</label><input id="senha" type="password" autocomplete="new-password" minlength="6" required>
<label for="cep">CEP:</label><input id="cep" maxlength="20">
<label for="endereco">Endereço:</label><input id="endereco" maxlength="255">
<button type="submit">Criar conta</button>
<div id="mensagem"></div>
</form>
<hr><button type="button" onclick="location.href='/login.html'">Voltar para o login</button>
</div>
<script>
document.getElementById('formCadastro').addEventListener('submit', async e=>{
 e.preventDefault(); const m=document.getElementById('mensagem'); m.textContent='';
 try{
  const r=await fetch('/api/cidadao/cadastro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:document.getElementById('nome').value,email:document.getElementById('email').value,senha:document.getElementById('senha').value,telefone:document.getElementById('telefone').value,cep:document.getElementById('cep').value,endereco:document.getElementById('endereco').value})});
  const d=await r.json(); if(!r.ok) throw new Error(d.mensagem||'Não foi possível criar a conta.');
  m.className='sucesso'; m.textContent='Cadastro realizado. Redirecionando para o login...'; setTimeout(()=>location.href='/login.html',800);
 }catch(err){m.className='erro';m.textContent=err.message;}
});
</script></body></html>
